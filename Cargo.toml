# A Cargo workspace (#1229): the `quill` terminal editor is this root package,
# and its UI-free editing core is `crates/quill-core`, which other front ends
# (the iPhone app, through `crates/quill-ffi`) share. `default-members` makes a
# bare `cargo build` / `test` / `clippy` from here cover every crate.
[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/quill-core", "crates/quill-ffi"]

[package]
name = "quill"
version = "1.3.0"
edition = "2021"
description = "A terminal editor optimized for writing novels"
license = "MIT"
repository = "https://github.com/CodingAnarchy/quill"
homepage = "https://github.com/CodingAnarchy/quill"
keywords = ["editor", "tui", "writing", "novel", "markdown"]
categories = ["command-line-utilities", "text-editors"]

# Prebuilt-binary install via `cargo binstall quill` (#1111). The asset scheme
# below MUST stay in lockstep with `.github/workflows/release.yml`, which builds
# the same `quill-{version}-{target}.tar.gz` tarballs (the `quill` binary at the
# tarball root) and attaches them to the GitHub Release for tag `v{version}`.
# A Homebrew formula (#1112) points at these same assets, so the scheme is stable.
# These are the DEFAULT feature set — the offline `local` (candle/Metal) backend
# can't be a universal prebuilt binary and stays a from-source `--features local`
# opt-in.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/quill-{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "quill{ binary-ext }"

[dependencies]
quill-core = { path = "crates/quill-core" }
ratatui = "0.30.2"
crossterm = "0.29"
# The save path snapshots the buffer's rope (an O(1) clone) for the background
# writer (#1227). Already built for quill-core.
ropey = "1.6"
unicode-width = "0.2"
unicode-segmentation = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
serde_json = "1.0.150"
time = { version = "0.3.49", features = ["local-offset", "macros", "parsing", "formatting"] }
ureq = { version = "3.3.0", features = ["json"] }
similar = "3.1.1"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-openssl"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
hf-hub = { version = "0.4", optional = true }

[dev-dependencies]
# The binary's tests drive the core, so they need its hermetic test stand-ins
# (no network, no keychain, a scratch config directory).
quill-core = { path = "crates/quill-core", features = ["test-support"] }

[features]
local = ["quill-core/local", "dep:hf-hub"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The iPhone app's build of the core (#1230, `ios/build-core.sh`). Release
# speed, but thin LTO keeps the per-target builds quick, and `panic = "unwind"`
# lets UniFFI turn a Rust panic into a Swift error instead of killing the app.
# Symbols stay in: Xcode strips the app when it archives it.
[profile.ios]
inherits = "release"
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false

[lints]
workspace = true

# Clippy lint policy. All `deny`: the tree is clean of every lint below (the
# idiomatic/perf/correctness cleanup landed in #793), so these are promoted from
# `warn` to `deny` to keep it that way — a new violation fails `cargo clippy`
# instead of scrolling past as a warning. Only `cargo clippy` honors these —
# normal `cargo build` is unaffected. If a nursery lint (`missing_const_for_fn`,
# `option_if_let_else`) throws a false positive on a toolchain bump, silence that
# one site with a local `#[allow(...)]` (with a `reason = "…"`) rather than
# dropping the whole category back to `warn`.
#
# Deliberately NOT enabled: doc_markdown (noisy, low value) and the
# cast_possible_*/cast_precision_loss/cast_sign_loss family (mostly benign
# usize<->u16 conversions in TUI layout code).
[workspace.lints.clippy]
# A bare unwrap/expect in the editor turns a violated assumption into a panic that
# takes the whole session down mid-write (#794). Denied in production code; the
# `allow-{unwrap,expect}-in-tests` keys in clippy.toml keep test unwraps (they
# *should* fail loudly). Infallible `write!` into an in-memory buffer uses
# `let _ = write!(...)`; a genuinely-provable invariant carries a local
# `#[allow(…, reason = "…")]`.
unwrap_used = "deny"
expect_used = "deny"

# Correctness-adjacent — most likely to be actual bugs.
case_sensitive_file_extension_comparisons = "deny"
maybe_infinite_iter = "deny"
unchecked_time_subtraction = "deny"
float_cmp = "deny"

# Allocation / clone hygiene (perf-adjacent).
format_push_string = "deny"
format_collect = "deny"
redundant_clone = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
needless_collect = "deny"
or_fun_call = "deny"
# Small but free FP wins (mul_add, etc.) — don't leave perf on the table.
suboptimal_flops = "deny"

# Idiom / clarity.
map_unwrap_or = "deny"
redundant_closure_for_method_calls = "deny"
unnested_or_patterns = "deny"
manual_let_else = "deny"
single_match_else = "deny"
match_same_arms = "deny"
semicolon_if_nothing_returned = "deny"
derive_partial_eq_without_eq = "deny"
needless_pass_by_value = "deny"
needless_pass_by_ref_mut = "deny"
unnecessary_wraps = "deny"
needless_continue = "deny"
items_after_statements = "deny"
cast_lossless = "deny"
uninlined_format_args = "deny"
unused_self = "deny"
ignore_without_reason = "deny"
# Prefer Self:: over the concrete type name inside impls (~948 sites, pure churn).
use_self = "deny"
# Push toward the T::default() convention over Default::default().
default_trait_access = "deny"
# No external consumers (quill-core is unpublished), so pub(crate) inside an
# already-private module is just noise to strip.
redundant_pub_crate = "deny"

# const-fn where possible. Nursery lint with occasional false positives (a fn that
# can't be const on stable yet, or one kept non-const for future flexibility) —
# silence those case-by-case with a local #[allow(clippy::missing_const_for_fn)].
missing_const_for_fn = "deny"

# Noisier / nursery — useful but flags more debatable cases; silence a false
# positive with a local #[allow(clippy::option_if_let_else)] if it gets chatty.
option_if_let_else = "deny"
