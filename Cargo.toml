[package]
name = "quill"
version = "0.2.0"
edition = "2021"
description = "A terminal editor optimized for writing novels"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
ropey = "1.6"
unicode-width = "0.2"
unicode-segmentation = "1.12"
tree-sitter = "0.26.9"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
serde_json = "1.0.150"
time = { version = "0.3.49", features = ["local-offset", "macros", "parsing", "formatting"] }
ureq = { version = "3.3.0", features = ["json"] }
similar = "3.1.1"
# Manuscript export (#7): the .docx/OOXML container is a zip; the XML is
# hand-written. Already present transitively, so this adds no new download.
zip = { version = "7.2", default-features = false, features = ["deflate"] }
# Flate (zlib) compression for embedded font programs and page content streams in
# the PDF export (#662). Already in the tree via `zip`, so this adds no download.
flate2 = "1.1"
# Version control (#54). https + ssh enable remote push/pull (#134); the local
# operations need neither. vendored-openssl builds OpenSSL from source so the
# HTTPS transport doesn't depend on a system OpenSSL install.
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-openssl"] }

# Local-model backend (#124): candle + tokenizers, off by default so the heavy
# inference deps (and their build) stay out of a normal Quill build. Build/run
# with `--features local`.
candle-core = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.20", optional = true }
# Hardware detection + direct model download for hardware-aware selection (#85).
sysinfo = { version = "0.33", optional = true }
hf-hub = { version = "0.4", optional = true }
# Raster decode/encode (#240 local PNG output; #490 PDF image ornaments — the PDF
# embeds decoded image samples, which needs a codec). A default dep since image
# ornaments are part of the standard designed-export path.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
spellbook = "0.4.2"
# Hyphenation for justified body text in the print PDF (#678). The `embed_en-us`
# feature bakes the en-US Knuth-Liang patterns into the binary, so export is
# self-contained (no runtime pattern files) and the dictionary builds once — the
# editor never touches it, it runs only on the export path.
hyphenation = { version = "0.8", features = ["embed_en-us"] }
# Print-ready PDF export (#464) reads glyph metrics (advances, cmap, bbox) from the
# bundled fonts it embeds. ttf-parser is pure-Rust and dependency-free; it only
# reads the font — the PDF itself is still hand-written (like docx/epub/pdf).
ttf-parser = "0.25"
# `variable-fonts` lets the subsetter instance a variable `[wght]` font to a pinned
# weight while subsetting (#638), so bold body text embeds a genuinely heavier
# outline rather than the default instance reused for every weight.
subsetter = { version = "0.2.6", features = ["variable-fonts"] }
# OS secret store for API keys (#530): keys live in the macOS Keychain / Linux
# Secret Service / Windows Credential Manager, not plaintext in the synced config.
# The platform-native + sync-secret-service stores cover desktop; env vars cover
# headless (where there's no login session to unlock the store).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
# Property / round-trip and adversarial-input testing for the data path (#265).
# Dev-only — never built into the shipped editor.
proptest = "1"

[features]
local = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:sysinfo", "dep:hf-hub"]

# On macOS, give candle the Metal backend (GPU). Cargo unions these features into
# the optional deps above, so `--features local` is CPU elsewhere and Metal here.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", optional = true, features = ["metal"] }
candle-transformers = { version = "0.9", optional = true, features = ["metal"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Clippy lint policy. All `warn`, not `deny`: these surface existing violations to
# clean up incrementally (tracked by the idiomatic/perf/correctness cleanup issues)
# without breaking the build; promote a category to `deny` once it's clean. Only
# `cargo clippy` honors these — normal `cargo build` is unaffected.
#
# Deliberately NOT enabled: doc_markdown (noisy, low value) and the
# cast_possible_*/cast_precision_loss/cast_sign_loss family (mostly benign
# usize<->u16 conversions in TUI layout code).
[lints.clippy]
# Correctness-adjacent — most likely to be actual bugs.
case_sensitive_file_extension_comparisons = "warn"
maybe_infinite_iter = "warn"
unchecked_time_subtraction = "warn"
float_cmp = "warn"

# Allocation / clone hygiene (perf-adjacent).
format_push_string = "warn"
format_collect = "warn"
redundant_clone = "warn"
assigning_clones = "warn"
implicit_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
# Small but free FP wins (mul_add, etc.) — don't leave perf on the table.
suboptimal_flops = "warn"

# Idiom / clarity.
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
manual_let_else = "warn"
single_match_else = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
derive_partial_eq_without_eq = "warn"
needless_pass_by_value = "warn"
needless_pass_by_ref_mut = "warn"
unnecessary_wraps = "warn"
needless_continue = "warn"
items_after_statements = "warn"
cast_lossless = "warn"
uninlined_format_args = "warn"
unused_self = "warn"
ignore_without_reason = "warn"
# Prefer Self:: over the concrete type name inside impls (~948 sites, pure churn).
use_self = "warn"
# Push toward the T::default() convention over Default::default().
default_trait_access = "warn"
# Single binary crate with no external consumers, so pub(crate) == pub for us;
# redundant pub(crate) on items in already-private modules is just noise to strip.
redundant_pub_crate = "warn"

# const-fn where possible. Nursery lint with occasional false positives (a fn that
# can't be const on stable yet, or one kept non-const for future flexibility) —
# silence those case-by-case with a local #[allow(clippy::missing_const_for_fn)].
missing_const_for_fn = "warn"

# Noisier / nursery — useful but flags more debatable cases; drop if too chatty.
option_if_let_else = "warn"
