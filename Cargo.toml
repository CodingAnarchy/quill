[package]
name = "quill"
version = "0.1.0"
edition = "2021"
description = "A terminal editor optimized for writing novels"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ropey = "1.6"
unicode-width = "0.2"
unicode-segmentation = "1.12"
tree-sitter = "0.26.9"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
serde_json = "1.0.150"
time = { version = "0.3.49", features = ["local-offset", "macros", "parsing", "formatting"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
