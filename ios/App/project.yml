# The Quill iPhone app (#1230), as an XcodeGen spec. Generate the Xcode project
# with `xcodegen generate` in this folder (it writes Quill.xcodeproj, which is
# git-ignored), after ios/build-core.sh has built the Rust core.
name: Quill
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  QuillKit:
    path: ../QuillKit
targets:
  Quill:
    type: application
    platform: iOS
    sources:
      - path: Quill
      # Copied into the bundle as a folder; the app installs a writable copy.
      - path: SampleNovel
        type: folder
        buildPhase: resources
    dependencies:
      - package: QuillKit
        product: QuillKit
    info:
      path: Quill/Info.plist
      properties:
        CFBundleDisplayName: Quill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUILL_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(QUILL_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
  # Drives the real app in a simulator (#1232): open the sample, edit a
  # chapter, background and kill the app, and find the words still there.
  QuillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QuillUITests
    dependencies:
      - target: Quill
    settings:
      base:
        TEST_TARGET_NAME: Quill
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.quill.QuillUITests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
schemes:
  Quill:
    build:
      targets:
        Quill: all
    test:
      targets:
        - QuillUITests
