# cross-rs configuration for release builds (.github/workflows/release.yml).
#
# The aarch64 Linux build runs inside cross's container, which doesn't have the
# arm64 libdbus dev package that keyring's secret-service backend needs. Add the
# arm64 architecture and install it before the build, and let pkg-config resolve
# the cross target.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install --assume-yes libdbus-1-dev:arm64 pkg-config",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig",
]
