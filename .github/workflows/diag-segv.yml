name: diag-segv

# THROWAWAY diagnostic for #1164 (intermittent x86_64-Linux SIGSEGV in the test
# suite). Reproduces under core dumps + gdb to capture the faulting backtrace,
# and runs serial vs parallel to test the data-race hypothesis. Not merged to
# master; dispatched manually from the diag/segv branch. Delete when done.

on:
  push:
    branches: [fix/parser-non-ascii-crash]
  workflow_dispatch:
    inputs:
      iterations:
        description: "Max suite runs per mode before giving up"
        default: "25"
        required: false

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [parallel, serial]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag-${{ matrix.mode }}

      - name: Install libdbus + gdb
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config gdb

      - name: Enable core dumps to a file (bypass systemd-coredump)
        run: |
          sudo mkdir -p /tmp/cores
          sudo chmod 777 /tmp/cores
          echo '/tmp/cores/%e.%p.core' | sudo tee /proc/sys/kernel/core_pattern
          cat /proc/sys/kernel/core_pattern

      - name: Build test binaries
        run: cargo test --no-run

      - name: Run the suite in a loop until it crashes
        id: loop
        shell: bash
        run: |
          set +e
          ulimit -c unlimited
          THREADS=""
          if [ "${{ matrix.mode }}" = "serial" ]; then THREADS="-- --test-threads=1"; fi
          n=${{ github.event.inputs.iterations }}
          for i in $(seq 1 "${n:-40}"); do
            echo "======== ${{ matrix.mode }} iteration $i ========"
            # Focus on the datapath parse proptests (the crashing thread) with a
            # high case count so the rare adversarial input shows up reliably.
            RUST_BACKTRACE=full PROPTEST_CASES=20000 cargo test datapath_tests $THREADS > run.log 2>&1
            code=$?
            echo "exit=$code"
            if [ $code -ne 0 ]; then
              echo "CRASHED on ${{ matrix.mode }} iteration $i (exit $code)"
              echo "crashed=1" >> "$GITHUB_OUTPUT"
              echo "----- tail of run.log -----"
              tail -50 run.log
              echo "----- last datapath tests to start (serial => the last is the crasher) -----"
              grep -aE '^test datapath_tests::[a-zA-Z0-9_]+ \.\.\.' run.log | tail -8 || true
              echo "----- overflow/panic signature -----"
              grep -aiE 'overflowed its stack|panicked|SIGSEGV|signal' run.log | tail -10 || true
              break
            fi
          done
          echo "done looping"

      - name: Backtrace any core dumps with gdb
        if: always()
        shell: bash
        run: |
          set +e
          ls -la /tmp/cores/ || true
          shopt -s nullglob
          cores=(/tmp/cores/*.core)
          if [ ${#cores[@]} -eq 0 ]; then echo "no core dumps captured"; exit 0; fi
          # The datapath tests live in the `quill` bin, so the crashing binary is
          # the bin unit-test ELF executable in deps. Pick it by file type.
          TESTBIN=""
          for f in target/debug/deps/quill-*; do
            case "$f" in *.d) continue;; esac
            if file "$f" | grep -q 'ELF.*executable'; then TESTBIN="$f"; break; fi
          done
          echo "test binary: ${TESTBIN:-NONE}"; file "$TESTBIN" 2>/dev/null
          for core in "${cores[@]}"; do
            echo "================ CORE: $core ================"
            gdb -batch -nx \
              -ex 'set pagination off' \
              -ex 'bt' \
              "$TESTBIN" "$core" 2>&1 | head -90
          done
