name: CI

# Gates PRs on the project's standard checks (see CLAUDE.md "Standard checks"
# and "Performance guards"). Branch protection should require this workflow to
# be green before a PR can merge to master.
#
# There is deliberately no toolchain-installing step in any job. The runners
# ship rustup, which reads `rust-toolchain.toml` at the repo root and installs
# the pinned version on the first cargo call — so CI and a contributor's machine
# resolve Rust from the same file. Installing it here (e.g. an action pinned to
# `@stable`) would reintroduce the split that broke master in #1198: `stable`
# meant "released today" on CI and "whatever I last updated to" locally.
# To change the Rust version, edit `rust-toolchain.toml` — not this file.
on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs for the same ref (e.g. force-push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # rustfmt: cheap and OS-independent, so run it once on ubuntu.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt --check
        run: cargo fmt --check

  # Default build: clippy (gated at 0 warnings) + tests on ubuntu and macos.
  # Plain `cargo test` does not run #[ignore]d tests, so the network catalog
  # checks and the perf guards stay excluded here.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # keyring's Linux secret-service backend links libdbus (macOS uses the
      # native keychain, so this is Linux-only).
      - name: Install libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  # Export validation (#1301): the sample books in tests/export-corpus, exported
  # with the core's own code, must give EPUBs that pass EPUBCheck (no errors or
  # warnings) and the Ace accessibility checker. On every PR, since a change to
  # the parser or the project model can break an export as surely as a change
  # to the writers.
  exports:
    name: export validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (Linux keyring backend)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install EPUBCheck and Ace
        run: |
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip -d "$RUNNER_TEMP"
          echo "EPUBCHECK=java -jar $RUNNER_TEMP/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"
          npm install -g @daisy/ace@1.3.3
          # Ace drives Electron, whose Chromium sandbox helper must be setuid
          # root, and which needs a display (xvfb-run gives it one below).
          sandbox="$(npm root -g)/@daisy/ace/node_modules/electron/dist/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          echo "ACE=xvfb-run -a ace" >> "$GITHUB_ENV"
      - name: Validate the exports
        run: scripts/check-exports.sh

  # `local` feature = on-device inference. On ubuntu candle is the CPU backend,
  # so we can build AND test it. macOS pulls candle's Metal backend, which we
  # only compile-check (no GPU on CI, and to keep the job fast).
  local-feature:
    name: local-feature (ubuntu, CPU candle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (Linux keyring backend)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo clippy --all-targets --features local
        run: cargo clippy --all-targets --features local -- -D warnings
      - name: cargo test --features local
        run: cargo test --features local

  # Compile-check only for the macOS Metal path: proves `--features local`
  # builds against candle's Metal backend without needing a GPU runner.
  local-feature-metal-check:
    name: local-feature (macos, Metal compile-check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --features local (Metal)
        run: cargo check --features local

  # The iPhone app (#1230): build the Rust core for device and simulator, run
  # QuillKit's Swift tests against the macOS slice, and build the app for both
  # the simulator and a device (unsigned). A core change that breaks the phone
  # build fails here. The Rust targets come from rust-toolchain.toml.
  # Whether this change can affect the iPhone app (#1310): the core, the Swift
  # bindings, the iOS project, the lockfile, or this workflow. A change to only
  # the terminal UI or the docs skips the iOS jobs, which are the slowest here.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'crates/quill-core/**'
              - 'crates/quill-ffi/**'
              - 'ios/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  # Build the core and the app once (#1310): the QuillKit tests, an unsigned
  # device build, and `build-for-testing` for the simulator, whose products the
  # per-phone jobs below test without building again.
  ios-build:
    name: ios (core + app)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the core (device, simulator, macOS)
        run: ios/build-core.sh
      - name: QuillKit tests
        run: ios/test-kit.sh --no-build
      - name: Generate the Xcode project
        run: cd ios/App && xcodegen generate
      - name: Build the app and its UI tests (simulator)
        run: >-
          xcodebuild -project ios/App/Quill.xcodeproj -scheme Quill
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build/DerivedData
          CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Build the app (device, unsigned)
        run: >-
          xcodebuild -project ios/App/Quill.xcodeproj -scheme Quill
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/build/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      # Just what the phone jobs run: the simulator build and its .xctestrun.
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ui-tests
          path: |
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/
            ios/build/DerivedData/Build/Products/*.xctestrun
          retention-days: 1

  # The UI tests in two jobs at once (#1310), the compact phones and the wide
  # ones: the newest base iPhone, e, and Pro, then the Pro Max and Air, each
  # upright and sideways (#1289), one phone after another within a job. Two
  # jobs, not five: GitHub runs only a few macOS jobs at a time, and five phone
  # jobs mostly queued behind each other and the other macOS jobs. One
  # simulator per runner: several on one 3-CPU runner made the tests flaky. The
  # iPhone Duo's poses need DeviceHub, so ios/test-duo.sh runs them locally.
  ios-ui:
    name: ios ui (${{ matrix.group }})
    needs: ios-build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: compact
            phones: base,e,pro
          - group: wide
            phones: pro-max,air
    steps:
      - uses: actions/checkout@v4
      - name: Start the simulator
        run: ios/test-iphones.sh --only ${{ matrix.phones }} --boot
      - uses: actions/download-artifact@v4
        with:
          name: ios-ui-tests
          path: ios/build/DerivedData/Build/Products/
      - name: UI tests
        run: ios/test-iphones.sh --only ${{ matrix.phones }} --no-build

  # Performance guards (`cargo perf` = release build, #[ignore]d timing tests,
  # single-threaded). Timing thresholds are tuned for a real machine; a shared CI
  # runner is a 2-vCPU VM that runs this CPU-bound work ~2.5–3x slower (e.g. the
  # window reparse measured ~7ms locally vs ~20ms here). The guards widen their
  # budget 3x when the `CI` env var is set (GitHub Actions sets it; see
  # `perf_budget_ms`/`perf_budget_us` in `crates/quill-core/src/testutil.rs`), so a real machine's
  # `cargo perf` stays the strict, authoritative gate while this job only reddens
  # on a gross (>3x) regression. It stays INFORMATIONAL (`continue-on-error`) so a
  # rare noisy run still can't turn master red. The catalog network checks no-op
  # here (QUILL_CATALOG_CHECK is unset), so the sweep stays offline.
  perf:
    name: perf (informational, push to master)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (Linux keyring backend)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo perf
        run: cargo perf
