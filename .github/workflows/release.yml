name: release

# Ship prebuilt per-OS/arch binaries so installing Quill doesn't require a Rust
# toolchain (#1111). Triggered by pushing a version tag (e.g. `v1.0.0`); builds
# the DEFAULT feature set for each target, packages a tarball + sha256 sidecar,
# and attaches everything to the GitHub Release for that tag.
#
# Also runnable manually (workflow_dispatch) against an existing tag — used to
# (re)build assets for a tag after a workflow fix, without moving the tag.
#
# ASSET SCHEME (must match Cargo.toml's [package.metadata.binstall] and any
# Homebrew formula, #1112):
#   tarball : quill-{version}-{target}.tar.gz   (the `quill` binary at the root)
#   checksum: quill-{version}-{target}.tar.gz.sha256
# where {version} is the tag without its leading `v` and {target} is the Rust
# target triple. The offline `local`/candle backend is NOT shipped here — Metal
# can't be a universal binary, so it stays a from-source `--features local` opt-in.
#
# TARGETS: Apple Silicon macOS plus x86_64 and arm64 Linux. Intel macOS
# (`x86_64-apple-darwin`) was dropped (#1203): Apple stopped shipping Intel Macs
# years ago, and on the arm64 `macos-latest` runner it was an untested cross
# build on the most expensive runner class. Intel Mac users build from source
# (`install.sh` or `cargo install`), which needs no release asset.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload assets for, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No toolchain action: rustup reads `rust-toolchain.toml` (the pin, #1200),
      # so the target must be added to *that* toolchain. Installing `@stable` and
      # adding the target there left cargo on the pinned version with no std for a
      # non-native target — E0463 "can't find crate for `core`" on the (since
      # dropped, #1203) x86_64-apple-darwin cross build in the 1.2.0 release. For a
      # native row this is a no-op, kept so the step is uniform across the matrix.
      # `cargo --version` makes the
      # rustup proxy install whichever toolchain applies (the pin, or default
      # stable for a pre-pin tag rebuilt via workflow_dispatch), then the target
      # goes onto it.
      - name: Install Rust target
        run: |
          cargo --version
          rustup target add ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # keyring's Linux secret-service backend links libdbus. Native Linux
      # builds get it from the runner; the cross (aarch64) build installs the
      # arm64 dev package inside the cross container via Cross.toml's pre-build.
      - name: Install libdbus (native Linux)
        if: ${{ runner.os == 'Linux' && !matrix.cross }}
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Written here (not committed) so a workflow_dispatch that checks out an
      # older tag still gets the arm64 dbus pre-build. keyring's secret-service
      # backend needs libdbus for the target arch inside the cross container.
      - name: Write Cross.toml (arm64 libdbus)
        if: matrix.cross
        run: |
          cat > Cross.toml <<'TOML'
          [target.aarch64-unknown-linux-gnu]
          pre-build = [
              "dpkg --add-architecture arm64",
              "apt-get update && apt-get install --assume-yes libdbus-1-dev:arm64 pkg-config",
          ]

          [target.aarch64-unknown-linux-gnu.env]
          passthrough = [
              "PKG_CONFIG_ALLOW_CROSS=1",
              "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig",
          ]
          TOML

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package tarball + checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref_name#v}"
          target="${{ matrix.target }}"
          name="quill-${version}-${target}"
          staging="$(mktemp -d)"
          cp "target/${target}/release/quill" "${staging}/quill"
          tarball="${name}.tar.gz"
          tar -czf "${tarball}" -C "${staging}" quill
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${tarball}" > "${tarball}.sha256"
          else
            shasum -a 256 "${tarball}" > "${tarball}.sha256"
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
