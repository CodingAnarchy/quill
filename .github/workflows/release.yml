name: release

# Ship prebuilt per-OS/arch binaries so installing Quill doesn't require a Rust
# toolchain (#1111). Triggered by pushing a version tag (e.g. `v0.9.2`); builds
# the DEFAULT feature set for each target, packages a tarball + sha256 sidecar,
# and attaches everything to the GitHub Release for that tag.
#
# ASSET SCHEME (must match Cargo.toml's [package.metadata.binstall] and the
# Homebrew formula in #1112):
#   tarball : quill-{version}-{target}.tar.gz   (the `quill` binary at the root)
#   checksum: quill-{version}-{target}.tar.gz.sha256
# where {version} is the tag without its leading `v` and {target} is the Rust
# target triple. The offline `local`/candle backend is NOT shipped here — Metal
# can't be a universal binary, so it stays a from-source `--features local` opt-in.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package tarball + checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          name="quill-${version}-${target}"
          staging="$(mktemp -d)"
          cp "target/${target}/release/quill" "${staging}/quill"
          tarball="${name}.tar.gz"
          tar -czf "${tarball}" -C "${staging}" quill
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${tarball}" > "${tarball}.sha256"
          else
            shasum -a 256 "${tarball}" > "${tarball}.sha256"
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
